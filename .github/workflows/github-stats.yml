
name: Atualizar estatísticas do GitHub

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Gerar estatísticas
        uses: cicirello/user-statistician@v1
        with:
          image-file: images/github-stats.svg
          custom-title: "Estatísticas de Ian Lucas"
          colors: dark-dimmed
          max-languages: 100
          locale: pt
          show-border: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
